components:
- components:
  - data_bindings:
    - {code: 'self.item[''Card_name'']', property: text, writeback: false}
    layout_properties: {grid_position: 'JEBILT,KTZTKC'}
    name: title_label
    properties: {bold: true, role: title}
    type: Label
  - layout_properties: {grid_position: 'JEBILT,CPDDKB'}
    name: edit_button
    properties: {align: right, icon: 'fa:edit', role: filled-button, text: ''}
    type: Button
  - layout_properties: {grid_position: 'JEBILT,RULOHD'}
    name: delete_button
    properties: {align: left, background: 'theme:Primary Container', foreground: '', icon: 'fa:trash-o', role: outlined-button, text: ''}
    type: Button
  - data_bindings:
    - {code: 'self.item[''Content'']', property: text, writeback: false}
    layout_properties: {grid_position: 'OLMKPF,POSYDC'}
    name: content_label
    properties: {font_size: 15, role: null}
    type: Label
  - data_bindings:
    - {code: 'self.item[''image'']', property: source, writeback: false}
    layout_properties: {grid_position: 'ITMPIF,KHWZIK'}
    name: image_1
    properties: {}
    type: Image
  layout_properties: {slot: default}
  name: content_panel
  properties:
    col_widths: '{"KTZTKC":60,"CPDDKB":10,"RULOHD":10}'
    role: elevated-card
    spacing:
      margin: [null, null, null, 0]
  type: ColumnPanel
container:
  properties: {html: ''}
  type: HtmlTemplate
is_package: true
